<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | Plataforma</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<section class="login-section">

<div class="login-container">

    <!-- CARD LOGIN -->
    <div class="login-box">

        <div class="login-logo-area">
            <img src="img/logo3.png" class="logo2">
            <span>Pirâmide de Software</span>
        </div>

        <h2>Entrar</h2>

       <form action="php/login.php" method="POST">

        <label>Email</label>
        <input type="email" name="email" class="login-input" placeholder="seuemail@email.com" required>

        <label>Senha</label>

        <div style="position: relative;">

        <input type="password" name="senha" id="senha" class="login-input" placeholder="••••••••" required>

        <i id="toggleSenha" class="bi bi-eye"
        style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;"></i>

        </div>

        <button type="submit" class="btn-primary login-btn">
        Entrar
        </button>

        </form>

        <div class="login-links">
            <a href="paginaCurso-cadastro.html">Cadastrar</a>
            |
            <a href="#">Esqueceu a senha?</a>
        </div>

    </div>

</div>

</section>

<script src="scripts.js"></script>

</body>
</html>
