<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | Plataforma</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="login-section">

<div class="login-container">

    <!-- CARD LOGIN -->
    <div class="login-box">

        <div class="login-logo-area">
            <img src="img/logo3.png" class="logo2">
            <span>Plataforma de Cursos</span>
        </div>

        <h2>Entrar</h2>

        <form>

            <label>Email</label>
            <input type="email" class="login-input" placeholder="seuemail@email.com">

            <label>Senha</label>
            <input type="password" class="login-input" placeholder="••••••••">

            <div class="login-remember">
                <input type="checkbox">
                <span>Lembrar-me</span>
            </div>

            <button type="submit" class="btn-primary login-btn">
                Entrar
            </button>

        </form>

        <div class="login-links">
            <a href="#">Cadastrar</a>
            |
            <a href="#">Esqueceu a senha?</a>
        </div>

    </div>

</div>

</section>

</body>
</html>
