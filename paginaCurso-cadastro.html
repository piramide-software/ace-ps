<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro | Plataforma</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<section class="login-section">

<div class="login-container">

<div class="login-box">

<div class="login-logo-area">
<img src="img/logo3.png" class="logo2">
<span>Pirâmide de Software</span>
</div>

<h2>Cadastrar</h2>

<form action="php/cadastro.php" method="POST">

<label>Nome</label>
<input type="text" name="nome" class="login-input" placeholder="Seu nome completo" required>

<label>Email</label>
<input type="email" name="email" class="login-input" placeholder="seuemail@email.com" required>

<label>CPF</label>
<input type="text" name="cpf" class="login-input" placeholder="000.000.000-00">

<label>Telefone</label>
<input type="text" name="telefone" class="login-input" placeholder="(99) 99999-9999">

<label>Data de Nascimento</label>
<input type="date" name="data_nascimento" class="login-input">


<label>Senha</label>

<div style="position: relative;">

<input type="password" id="senha" name="senha" class="login-input" placeholder="••••••••" required>

<i id="toggleSenha" class="bi bi-eye"
style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;"></i>

</div>


<button type="submit" class="btn-primary login-btn">
Cadastrar
</button>

</form>

<div class="login-links">
<a href="paginaCurso-login.html">Já tenho conta</a>
</div>

</div>

</div>

</section>

<script src="scripts.js"></script>

</body>
</html>
