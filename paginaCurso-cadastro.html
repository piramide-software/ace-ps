<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro | Plataforma</title>

<!-- ✅ Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Seu CSS -->
<link rel="stylesheet" href="css/style.css">

<!-- Ícones -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body>

<section class="cadastro-section container-fluid">
  <div class="row vh-100">

    <!-- LADO ESQUERDO -->
    <div class="col-md-6 cadastro-left">
      
      <div class="cadastro-box">

       <div class="mb-4 cadastro-logo-area">
          <img src="img/logo3.png" class="logo2 mb-2">
          <h4>Pirâmide de Software</h4>
        </div>

        <h2 class="mb-4">Cadastrar</h2>

        <form action="php/cadastro.php" method="POST">

          <label>Nome</label>
          <input type="text" name="nome" class="form-control mb-3" placeholder="Seu nome completo" required>

          <label>Email</label>
          <input type="email" name="email" class="form-control mb-3" placeholder="seuemail@email.com" required>

          <label>CPF</label>
          <input type="text" name="cpf" class="form-control mb-3" placeholder="000.000.000-00">

          <label>Telefone</label>
          <input type="text" name="telefone" class="form-control mb-3" placeholder="(99) 99999-9999">

          <label>Data de Nascimento</label>
          <input type="date" name="data_nascimento" class="form-control mb-3">

          <label>Senha</label>

          <div class="position-relative mb-4">
            <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required>
            <i id="toggleSenha" class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3" style="cursor:pointer;"></i>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Cadastrar
          </button>

        </form>

        <div class="mt-3 text-center">
          <a href="paginaCurso-login.html">Já tenho conta</a>
        </div>

      </div>

    </div>

    <!-- LADO DIREITO -->
    <div class="col-md-6 cadastro-right d-none d-md-block">
      <div class="overlay-text">
        <h2>Bem-vindo 🚀</h2>
        <p>Crie sua conta e comece sua jornada na programação</p>
      </div>
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>

</body>
</html>
