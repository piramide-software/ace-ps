<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pirâmide de Software | Inicio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- CSS custom -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Barra Superior -->
  <div class="top-bar text-center">
    <div class="container d-flex justify-content-between">
      <div class="left-top-bar">Aprenda de onde estiver 📚</div>
      <div>
        <a href="#">Meus Cursos</a>
        <a href="#">Minha Conta</a>
        <a href="#">Suporte</a>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md">
    <div class="container">
      <img src="img/Logo3.png" alt="logo" class="logo">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Fale conosco</a></li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              Cursos
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Básico</a></li>
              <li><a class="dropdown-item" href="#">Intermediário</a></li>
              <li><a class="dropdown-item" href="#">Avançado</a></li>
            </ul>
          </li>
        </ul>

        <!-- Botão Dark/Light -->
        <button id="themeToggle" class="btn btn-outline-secondary ms-lg-3 mt-2 mt-lg-0">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

   
  <h1 class="title text-center mt-5">Minha conta</h1>
  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-grow-1 d-flex align-items-center">


    <div class="container mt-3 w-100">
      <div class="row g-4 justify-content-center">

        <div class="col-md-3 col-6">
          <div class="block2 text-center p-4">
            <i class="bi bi-play-circle fs-1 mb-2" style="color:#9d5c1f;"></i>
            <div class="nome_curso_mini">Meus Cursos</div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="block2 text-center p-4">
            <i class="bi bi-award fs-1 mb-2" style="color:#9d5c1f;"></i>
            <div class="nome_curso_mini">Certificados</div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="block2 text-center p-4">
            <i class="bi bi-question-circle fs-1 mb-2" style="color:#9d5c1f;"></i>
            <div class="nome_curso_mini">Ajuda</div>
          </div>
        </div>

        <div class="col-md-3 col-6">
          <div class="block2 text-center p-4">
            <i class="bi bi-person-badge fs-1 mb-2" style="color:#9d5c1f;"></i>
            <div class="nome_curso_mini">Cadastro</div>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center p-3">
    <p>&copy; 2025 Pirâmide de Software. Todos os direitos reservados.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Dark Mode -->
  <script>
    const toggleBtn = document.getElementById("themeToggle");
    const html = document.documentElement;

    if (localStorage.getItem("theme")) {
      html.setAttribute("data-bs-theme", localStorage.getItem("theme"));
      toggleBtn.innerHTML = localStorage.getItem("theme") === "dark"
        ? '<i class="fas fa-sun"></i>'
        : '<i class="fas fa-moon"></i>';
    }

    toggleBtn.addEventListener("click", () => {
      if (html.getAttribute("data-bs-theme") === "light") {
        html.setAttribute("data-bs-theme", "dark");
        toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        localStorage.setItem("theme", "dark");
      } else {
        html.setAttribute("data-bs-theme", "light");
        toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
        localStorage.setItem("theme", "light");
      }
    });
  </script>

</body>
</html>
